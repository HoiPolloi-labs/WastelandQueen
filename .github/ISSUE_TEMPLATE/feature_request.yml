name: Feature request
description: Suggest an improvement to the WK coordination flow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or gap?
      description: What are you trying to do that the tool doesn't support yet?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: wk-context
    attributes:
      label: WK mechanic it relates to (if any)
      description: Hub / turrets / mud / hit-squad / NAP / scoring / heroes / …
